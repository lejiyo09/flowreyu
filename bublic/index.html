<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-2 폐급리스트 AI 테스트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #eee;
    }
    .wrap {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 42px 0 70px;
    }
    h1 { margin: 0 0 8px; font-size: 32px; }
    .sub { color: #999; margin-bottom: 28px; }
    .card {
      background: #1b1b1b;
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
    }
    label { display:block; margin: 0 0 8px; font-weight: 700; }
    input, textarea {
      width: 100%;
      border: 1px solid #3a3a3a;
      background: #111;
      color: #eee;
      border-radius: 12px;
      padding: 13px;
      font: inherit;
      outline: none;
    }
    textarea { min-height: 150px; resize: vertical; }
    input:focus, textarea:focus { border-color: #777; }
    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      background: #eee;
      color: #111;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    .result { display:none; }
    .score {
      display:flex;
      align-items:center;
      gap:18px;
      margin-bottom: 18px;
    }
    .number { font-size: 56px; font-weight: 900; line-height: 1; }
    .grade { font-size: 25px; font-weight: 900; }
    .title { font-size: 25px; font-weight: 900; margin-bottom: 8px; }
    .muted { color:#aaa; }
    .action {
      border-top: 1px solid #303030;
      padding: 13px 0;
    }
    .error {
      display:none;
      background:#351b1b;
      border:1px solid #713434;
      color:#ffbdbd;
      padding:13px;
      border-radius:12px;
      margin-top:16px;
      white-space:pre-wrap;
    }
    .status { color:#999; font-size:13px; margin-top:10px; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>🏆 폐급리스트 AI</h1>
    <div class="sub">Gemini API 연결 테스트용 1차 프로토타입</div>

    <section class="card">
      <label for="name">닉네임</label>
      <input id="name" placeholder="예: 철수" maxlength="30">

      <label for="actions" style="margin-top:18px;">행동 목록</label>
      <textarea id="actions" placeholder="한 줄에 하나씩 입력하세요.

예:
수업 시간에 몰래 게임함
급식 줄을 새치기함
친구 숙제를 베낌"></textarea>

      <button id="analyze">AI 분석하기</button>
      <div id="status" class="status"></div>
      <div id="error" class="error"></div>
    </section>

    <section id="result" class="card result">
      <div class="score">
        <div class="number" id="score">0</div>
        <div>
          <div class="grade" id="grade">-</div>
          <div class="muted">폐급도</div>
        </div>
      </div>

      <div class="title" id="title"></div>
      <p id="summary"></p>
      <p class="muted" id="comment"></p>

      <h3>행동별 분석</h3>
      <div id="actionsResult"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    $("analyze").addEventListener("click", async () => {
      const name = $("name").value.trim();
      const actions = $("actions").value
        .split("\n")
        .map(v => v.trim())
        .filter(Boolean);

      $("error").style.display = "none";
      $("result").style.display = "none";

      if (!name || !actions.length) {
        $("error").textContent = "닉네임과 행동을 입력해주세요.";
        $("error").style.display = "block";
        return;
      }

      $("analyze").disabled = true;
      $("status").textContent = "Gemini가 분석 중...";

      try {
        const response = await fetch("/api/waste/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, actions })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error + (data.detail ? "\n" + JSON.stringify(data.detail, null, 2) : "")
          );
        }

        $("score").textContent = data.score;
        $("grade").textContent = data.grade;
        $("title").textContent = data.title;
        $("summary").textContent = data.summary;
        $("comment").textContent = data.comment;

        $("actionsResult").innerHTML = "";
        for (const item of data.actions || []) {
          const div = document.createElement("div");
          div.className = "action";
          div.innerHTML = `
            <strong>${escapeHtml(item.action)}</strong>
            <span class="muted"> — ${item.score}점</span>
            <div class="muted" style="margin-top:5px">${escapeHtml(item.reason)}</div>
          `;
          $("actionsResult").appendChild(div);
        }

        $("result").style.display = "block";
        $("status").textContent = "분석 완료";
      } catch (err) {
        $("error").textContent = err.message || "알 수 없는 오류";
        $("error").style.display = "block";
        $("status").textContent = "";
      } finally {
        $("analyze").disabled = false;
      }
    });

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
